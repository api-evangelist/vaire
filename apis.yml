name: Vaire Computing
description: Vaire Computing is a deep-tech semiconductor startup building reversible
  computing chips for near-zero energy computing. Its reversible logic gates recover
  and recycle the energy of computation instead of dissipating it as heat, aiming
  to decouple energy consumption from growth in computing power. The company was
  co-founded by Rodolfo Rosini (CEO) and Dr Hannah Earley (CTO), is backed by Seedcamp,
  7percent Ventures, and Lifeline Ventures, and publishes technology and software
  whitepapers. Vaire currently publishes no public API, SDK, or developer portal.
